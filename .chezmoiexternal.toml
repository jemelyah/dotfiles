    url = "https://ftp.nluug.nl/pub/vim/runtime/spell/es.utf-8.spl"

[".local/share/nvim/site/spell/es.utf-8.sug"]
    type = "file"
    url = "https://ftp.nluug.nl/pub/vim/runtime/spell/es.utf-8.sug"

[".local/share/nvim/site/spell/lv.utf-8.spl"]
    type = "file"
