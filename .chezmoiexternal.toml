# Neovim spell files for the non-English languages in spelllang (options.lua). LazyVim disables netrw, so Neovim cannot download them itself.

[".local/share/nvim/site/spell/ru.utf-8.spl"]
    type = "file"
    url = "https://ftp.nluug.nl/pub/vim/runtime/spell/ru.utf-8.spl"

