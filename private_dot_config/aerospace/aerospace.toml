config-version = 2
start-at-login = true
after-startup-command = []

persistent-workspaces = ['browser', 'terminal', 'obsidian', 'logos', 'music', 'management']

on-window-detected = [
  { if = 'test %{app-bundle-id} = com.brave.Browser', run = ['move-node-to-workspace browser'] },
  { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['move-node-to-workspace terminal'] },
  { if = 'test %{app-bundle-id} = md.obsidian', run = ['move-node-to-workspace obsidian'] },
  { if = 'test %{app-bundle-id} = com.logos.desktop.logos', run = ['move-node-to-workspace logos'] },
  { if = 'test %{app-bundle-id} = com.ableton.live', run = ['move-node-to-workspace music'] },
  { if = 'test %{app-bundle-id} = com.medeli.ASMManager', run = ['move-node-to-workspace music'] },
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-b = 'workspace browser'
alt-t = 'workspace terminal'
alt-o = 'workspace obsidian'
alt-g = 'workspace logos'
alt-m = 'workspace music'
alt-n = 'workspace management'
alt-shift-b = 'move-node-to-workspace browser'
alt-shift-t = 'move-node-to-workspace terminal'
alt-shift-o = 'move-node-to-workspace obsidian'
alt-shift-g = 'move-node-to-workspace logos'
alt-shift-m = 'move-node-to-workspace music'
alt-shift-n = 'move-node-to-workspace management'
alt-slash = 'layout tiles horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'
